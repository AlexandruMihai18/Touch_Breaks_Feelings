[project]
name = "touch_from_segmentation"
version = "0.1.0"
requires-python = ">=3.10,<3.12"

dependencies = [
    # Core ML stack
    "torch>=2.5.1,<2.8",
    "torchvision>=0.20.1,<0.23",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    # Vision / utils
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python>=4.9",
    # UI
    "gradio>=4.0.0",
    "setuptools>=82.0.1",
    "lightning>=2.6.1",
    "wandb>=0.26.0",
    "torchmetrics>=1.9.0",
    "scipy>=1.15.3",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.7.2",
    "ipykernel>=7.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
